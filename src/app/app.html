<header class="site-header">
  <img class="site-header__logo" src="wordmark.png" alt="Level One" />
  <nav class="site-header__nav"></nav>
</header>

<main class="hero">
  <div class="hero__content">
    <p class="hero__label">COMUNICAZIONE AUDIOVISIVA — LUGANO</p>
    <h1 class="hero__title">
      Il tuo brand al<br />
      livello successivo
    </h1>
  </div>

  <aside class="services">
    <ul class="services__list" #list>
      @for (word of words; track word) {
        <li class="services__item">{{ word }}</li>
      }
    </ul>
  </aside>

  <a class="scroll-hint" href="#contatti" aria-label="Scorri ai contatti">
    <span>CONTATTI</span>
    <span class="scroll-hint__arrow">↓</span>
  </a>
</main>

<section class="contact" id="contatti">
  <p class="contact__label">CONTATTI</p>
  <div class="contact__grid">
    <a class="contact__item"
       href="https://maps.google.com/?q=Via+Boscioro+20,+6962+Lugano,+Svizzera"
       target="_blank" rel="noopener">
      <span class="contact__key">INDIRIZZO</span>
      <span class="contact__value">Via Boscioro 20<br />6962 Lugano, Svizzera</span>
    </a>
    <a class="contact__item" href="mailto:info@leveloneagency.ch">
      <span class="contact__key">EMAIL</span>
      <span class="contact__value">info@leveloneagency.ch</span>
    </a>
    <a class="contact__item"
       href="https://www.instagram.com/leveloneagency.ch/"
       target="_blank" rel="noopener">
      <span class="contact__key">INSTAGRAM</span>
      <span class="contact__value">@leveloneagency.ch</span>
    </a>
  </div>
  <footer class="contact__footer">
    <span>LUGANO — CH</span>
    <span>leveloneagency.ch</span>
  </footer>
</section>
